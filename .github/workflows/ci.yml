# Pipeline de CI (GitHub Actions). Espelha o portão de qualidade local
# (ruff -> black -> mypy -> pytest) para que um check verde no PR signifique o
# mesmo que um clone limpo passando. Dois jobs independentes:
#   qualidade  ruff -> black --check -> mypy -> pytest  (matriz: Python 3.12 e 3.14)
#   seguranca  pip-audit (CVEs) + manage.py check --deploy (postura de produção)
#
# O piso do projeto é o 3.12 (a versão do servidor no PythonAnywhere, que lista
# Python só até o 3.13); o 3.14 é a versão estável mais nova. A matriz testa as
# duas pontas, para o piso declarado no pyproject.toml não ser só uma promessa.
#
# CodeQL (code scanning) roda no workflow próprio codeql.yml, porque o repo é
# público e o code scanning é grátis. Dependabot (alerts + version updates) cobre
# a varredura contínua de dependências.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos do mesmo ref: um push novo no PR mata o run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Portão de qualidade: a sequência canônica do CLAUDE.md ---
  qualidade:
    name: Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    # A suíte roda em menos de 1 minuto; o teto só corta um run travado.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # portfolio.settings faz os.getenv("SECRET_KEY") + ValueError se ausente;
      # valor descartável, só para o settings importar em CI (não é produção).
      SECRET_KEY: ci-placeholder-nao-usar-em-producao-3MVL5eNw-XBWZDpk
      DEBUG: "True"
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instala o uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sincroniza o ambiente (runtime + grupo dev)
        run: uv sync --frozen

      - name: Ruff (lint + ordem de imports)
        run: uv run ruff check .

      - name: Black (formatacao)
        run: uv run black --check .

      - name: Mypy (tipos)
        run: uv run mypy app_portfolio portfolio

      - name: Pytest (suite completa)
        run: uv run pytest

  # --- Segurança: não bloqueia o merge por si só; é um sinal visível no PR ---
  seguranca:
    runs-on: ubuntu-26.04
    # pip-audit e check --deploy levam segundos; o teto só corta um run travado.
    timeout-minutes: 5
    env:
      SECRET_KEY: ci-placeholder-nao-usar-em-producao-3MVL5eNw-XBWZDpk
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo seguinte precisa do token do GitHub; ele não fica no disco.
          persist-credentials: false

      - name: Instala o uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sincroniza o ambiente
        run: uv sync --frozen

      - name: pip-audit (CVEs conhecidas nas dependencias)
        run: uv run pip-audit

      - name: check --deploy (SSL, HSTS, cookies, headers)
        run: uv run python manage.py check --deploy
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: "ci-placeholder.invalid"
