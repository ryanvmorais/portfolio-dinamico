# =============================================================================
# Configuração do projeto (PEP 518/621) — gerenciado com uv.
#
# [project]                      metadados + dependências de runtime
# [dependency-groups] dev        ferramentas de desenvolvimento (uv instala por padrão)
# [project.optional-dependencies] prod   extras de produção (uv sync --extra prod)
#
# As versões exatas de TODO o grafo (diretas + transitivas) ficam travadas no
# uv.lock, gerado por `uv lock`. As tabelas [tool.*] concentram a config das
# ferramentas de qualidade.
# =============================================================================

[project]
name = "portfolio-dinamico"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1.2",
    "Pillow>=13.0.0",
    "whitenoise>=6.12.0",
    "bleach>=6.4.0",
    "django-csp>=4.0",
    "python-dotenv>=1.2.4",
    "certifi>=2026.10.23",
]

[project.optional-dependencies]
prod = [
    "gunicorn",
    "psycopg2-binary",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "black>=26.10.1",
    "mypy>=2.4.1",
    "django-stubs[compatible-mypy]>=6.1.2",
    "ipython>=9.18.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[tool.uv]
# Aplicação Django (não é uma lib a ser empacotada/instalada como pacote).
package = false
# Resolve só pacotes publicados há 7+ dias — janela de quarentena contra
# versões maliciosas/instáveis recém-publicadas (supply chain).
exclude-newer = "7 days"

# --- Formatador ---
[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations|\\.venv"

# --- Linter (substitui o flake8 + isort, lê o pyproject nativamente) ---
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (≈ flake8), I = isort, UP = pyupgrade, D = pydocstyle
# (D213 pelo nome: a convenção Google o desliga)
select = ["E", "W", "F", "I", "UP", "D", "D213"]
# E501 (comprimento de linha) fica a cargo do black; docstrings/help_text e URLs
# longas não são quebradas pelo formatador e não devem falhar o lint.
ignore = [
    "E501",
    "D1",  # docstring ausente (D100 a D107) fica fora do portão por enquanto; tire daqui conforme cada módulo for documentado
    "D212",  # o estilo do projeto abre a docstring com `"""` sozinho e o resumo na linha seguinte (D213)
    "D205",  # o resumo pode ser um parágrafo que quebra linha, seguido de linha em branco
]

[tool.ruff.lint.pydocstyle]
# Seções no estilo Google (`Args:`, `Returns:`, `Raises:`), como nas docstrings.
convention = "google"

# --- Testes ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portfolio.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]

# --- Cobertura ---
[tool.coverage.run]
source = ["app_portfolio"]
omit = ["*/migrations/*", "*/tests/*"]

# --- Type checker ---
[tool.mypy]
python_version = "3.12"
strict = true
# Os genéricos do Django (ModelAdmin[...], ListView[...]) são incômodos e de
# baixo valor em código de aplicação; desligar este check do strict é prática
# comum em projetos Django + django-stubs.
disallow_any_generics = false
show_error_codes = true
pretty = true
plugins = ["mypy_django_plugin.main"]
exclude = ['migrations/', '\.venv/', 'venv-portfolio/']

# Migrations são auto-geradas: não exigir tipagem
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

# Suíte de testes: relaxa checagens que conflitam com padrões idiomáticos de
# teste (response.json() do test client, .first() opcional, None proposital).
# disallow_untyped_defs desligado porque os testes usam fixtures do
# pytest-django (client, settings) via injeção de parâmetro — tipá-las exigiria
# importar tipos internos do pytest só para satisfazer o mypy. Os testes são
# validados pela execução (pytest), não pelo type checker.
[[tool.mypy.overrides]]
module = ["app_portfolio.tests", "app_portfolio.test_interface"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "union-attr", "arg-type", "return-value"]

# Bibliotecas de terceiros sem stubs de tipagem
[[tool.mypy.overrides]]
module = ["bleach.*", "csp.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "portfolio.settings"
